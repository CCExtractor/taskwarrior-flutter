[package]
name = "tc_helper"
version = "0.1.0"
edition = "2021"

[lib]
name="tc_helper"
crate-type=["staticlib","cdylib"]

[dependencies]
taskchampion = "2.0.3"
anyhow = "1.0"
tokio = { version = "1.40", features = ["full"] }
uuid = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"                          # Structured, typed error handling
flutter_rust_bridge = "=2.11.1"           # Rust runtime bridge
flutter_rust_bridge_macros = "2.11.1"    # Procedural macros support

[build-dependencies]
flutter_rust_bridge_codegen = "2.11.1"  # Code generator CLI

# 32-bit ARM (armeabi-v7a) has no pre-generated aws-lc-sys bindings, so its
# `bindgen` feature (needs libclang) is required — but ONLY for that target.
# arm64 Android, iOS and the host use aws-lc-sys' pre-generated bindings;
# forcing bindgen on them (notably iOS) breaks linking.
[target.armv7-linux-androideabi.dependencies]
aws-lc-sys = { version = "0.30", features = ["bindgen"] }
